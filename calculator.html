      <div id="auth-error" style="color:#f85149;font-size:13px;height:18px;margin-top:8px;">&nbsp;</div>
      <button type="submit" style="width:100%;margin-top:4px;padding:13px;border:none;border-radius:10px;background:#1ABC9C;color:#fff;font-size:16px;font-weight:600;cursor:pointer;">Openen</button>
    </form>
  </div>
  <script>
    (function () {
      var GATE_KEY = 'zk-am-unlocked-v1';
      // SHA-256 van het wachtwoord (de platte tekst staat NIET in dit bestand)
      var PASS_HASH = '11232b2f4476255e9bfceded105b4841486050ab60817145a28956b154e59479';
      var gate = document.getElementById('auth-gate');
      var form = document.getElementById('auth-form');
      var input = document.getElementById('auth-pass');
      var err = document.getElementById('auth-error');

      function unlock() {
        gate.parentNode && gate.parentNode.removeChild(gate);
      }
      if (localStorage.getItem(GATE_KEY) === '1') { unlock(); return; }

      async function sha256(text) {
        var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return Array.from(new Uint8Array(buf)).map(function (b) {
          return b.toString(16).padStart(2, '0');
        }).join('');
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        var h = await sha256(input.value);
        if (h === PASS_HASH) {
          localStorage.setItem(GATE_KEY, '1');
          unlock();
        } else {
          err.textContent = 'Onjuist wachtwoord';
          input.value = '';
          input.focus();
        }
      });
      input.focus();
    })();
  </script>

    const { useState, useMemo, useRef, useEffect, useContext } = React;

// Context waarmee een zoekresultaat de juiste Collapse automatisch openklapt + erheen scrollt
const CollapseTargetCtx = React.createContext(null);
const normTitle = s => (s || "").toString().toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();

// ============================================================
// COLLAPSIBLE CARD COMPONENT (top-level for state persistence)
// ============================================================

function Collapse({ title, color = "#fff", children, defaultOpen = false, icon = null }) {
  const [open, setOpen] = useState(defaultOpen);
  const target = useContext(CollapseTargetCtx);
  const elRef = useRef(null);
  useEffect(() => {
    if (target && target.title && normTitle(title) === normTitle(target.title)) {
      setOpen(true);
      const t = setTimeout(() => {
        if (elRef.current && elRef.current.scrollIntoView) {
          elRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }, 90);
      return () => clearTimeout(t);
    }
  }, [target]);
  return (
    <div ref={elRef} style={{
      marginBottom: "12px",
      borderRadius: "12px",
      overflow: "hidden",
      border: open ? `1px solid ${color}30` : "1px solid rgba(255,255,255,0.08)",
      transition: "border-color 0.2s",
    }}>
      <button
        onClick={() => setOpen(p => !p)}
        style={{
          width: "100%",
          padding: "13px 16px",
          background: open ? `${color}10` : "rgba(255,255,255,0.04)",
          border: "none",
          cursor: "pointer",
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          fontFamily: "'DM Sans', sans-serif",
          color: "#fff",
          gap: "8px",
        }}
      >
        <span style={{
          fontSize: "13px",
          fontWeight: 700,
          textTransform: "uppercase",
          letterSpacing: "1.5px",
          color: color,
        }}>{title}</span>
        <span style={{
          fontSize: "18px",
          color: "#555",
          transform: open ? "rotate(90deg)" : "rotate(0deg)",
          transition: "transform 0.2s ease",
          flexShrink: 0,
        }}>›</span>
      </button>
      {open && (
        <div style={{ padding: "4px 16px 16px" }}>
          {children}
        </div>
      )}
    </div>
  );
}

// ============================================================
// SCROLL PICKER COMPONENT (iOS-stijl trommelroller)
// ============================================================

function ScrollPicker({ items, selectedIndex, onIndexChange, accentColor = "#2ECC71" }) {
  const ref = useRef(null);
  const itemH = 44;
  const visible = 3;
  const pad = 1;
  // Onthoudt of de laatste selectedIndex-wijziging van de eigen scroll/tik kwam.
  // Zo niet corrigeren we de scrollpositie NIET tijdens een lopende scrollbeweging
  // van de gebruiker (dat gaf het "heen en weer"-gehaper) — alleen bij een externe
  // wijziging (bv. de leeftijd-roller die het gewicht automatisch aanpast).
  const isInternalChange = useRef(false);

  const paddedItems = [
    ...Array(pad).fill({ label: "", isPad: true }),
    ...items,
    ...Array(pad).fill({ label: "", isPad: true }),
  ];

  useEffect(() => {
    if (isInternalChange.current) {
      isInternalChange.current = false;
      return;
    }
    if (ref.current) {
      const current = Math.round(ref.current.scrollTop / itemH);
      if (current !== selectedIndex) ref.current.scrollTop = selectedIndex * itemH;
    }
  }, [selectedIndex]);

  const handleScroll = () => {
    if (!ref.current) return;
    const idx = Math.round(ref.current.scrollTop / itemH);
    const clamped = Math.max(0, Math.min(idx, items.length - 1));
    if (clamped !== selectedIndex) {
      isInternalChange.current = true;
      onIndexChange(clamped);
    }
  };

  return (
    <div style={{ position: "relative", height: itemH * visible, overflow: "hidden", borderRadius: "12px" }}>
      <div style={{
        position: "absolute", top: itemH * pad, left: 0, right: 0, height: itemH,
        background: `${accentColor}18`, border: `1px solid ${accentColor}50`,
        borderRadius: "10px", pointerEvents: "none", zIndex: 2,
        boxShadow: `0 0 14px ${accentColor}30, inset 0 0 8px ${accentColor}12`,
      }} />
      <div style={{
        position: "absolute", top: 0, left: 0, right: 0, height: itemH * pad,
        background: "linear-gradient(to bottom, #0D1117 30%, transparent)",
        pointerEvents: "none", zIndex: 3,
      }} />
      <div style={{
        position: "absolute", bottom: 0, left: 0, right: 0, height: itemH * pad,
        background: "linear-gradient(to top, #0D1117 30%, transparent)",
        pointerEvents: "none", zIndex: 3,
      }} />
      <div
        ref={ref}
        className="picker-scroll"
        onScroll={handleScroll}
        style={{
          height: "100%", overflowY: "scroll",
          scrollSnapType: "y mandatory",
          WebkitOverflowScrolling: "touch",
          scrollbarWidth: "none",
        }}
      >
        {paddedItems.map((item, i) => {
          const realIdx = i - pad;
          const isSelected = realIdx === selectedIndex;
          return (
            <div
              key={i}
              onClick={() => {
                if (item.isPad) return;
                isInternalChange.current = true;
                onIndexChange(realIdx);
                if (ref.current) ref.current.scrollTop = realIdx * itemH;
              }}
              style={{
                height: itemH, display: "flex", alignItems: "center",
                justifyContent: "center", scrollSnapAlign: "center",
                cursor: item.isPad ? "default" : "pointer",
                fontSize: isSelected ? "17px" : "13px",
                fontWeight: isSelected ? 700 : 400,
                color: isSelected ? "#fff" : "#444",
                fontFamily: "'JetBrains Mono', monospace",
                textShadow: isSelected ? `0 0 14px ${accentColor}50` : "none",
                transition: "font-size 0.12s ease-out, color 0.12s ease-out, text-shadow 0.12s ease-out",
              }}
            >
              {!item.isPad ? item.label : ""}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function calcStandardWeight(ageYears) {
  const m = ageYears * 12;
  if (m <= 1) return 4;
  if (m <= 3) return 5;
  if (m <= 6) return 7;
  if (m <= 9) return 9;
  if (m <= 12) return 10;
  if (ageYears <= 10) return Math.round(2.5 * ageYears + 8);
  if (ageYears <= 14) return Math.round(4 * ageYears - 2);
  return Math.round(5 * ageYears - 10);
}

      age < 2 ? "Mac 1 / Miller 1" :

    const computeMedDosis = (m, calcWeight, age, hasAge) => {

      if (m.med === "Cefuroxim" && calcWeight >= 40) {

      if (m.is421) {

          : calcWeight <= 20 ? 10 * 4 + (calcWeight - 10) * 2
          : 10 * 4 + 10 * 2 + (calcWeight - 20) * 1;

      // Generieke pompstand (ml/uur) voor infuusmiddelen met een vaste spuitconcentratie (m.pompConc, in dezelfde eenheid als m.unit)

        ? (m.unit.endsWith("/min") ? (dosis * 60) / m.pompConc : m.unit.endsWith("/uur") ? dosis / m.pompConc : null)

                  setCalcLeeftijdIdx(idx);
                  const ageVal = AGE_ITEMS[idx].value;

          <div style={{ display: "flex", justifyContent: "space-between", marginTop: "10px", padding: "8px 12px", background: "rgba(255,255,255,0.04)", borderRadius: "8px" }}>
            <span style={{ fontSize: "12px", color: "#666" }}>{AGE_ITEMS[calcLeeftijdIdx]?.label}</span>
            <span style={{ fontSize: "13px", fontWeight: 700, color: "#fff", fontFamily: "'JetBrains Mono', monospace" }}>
              {WEIGHT_ITEMS[calcGewichtIdx]?.label}
              {!gewichtManual && <span style={{ fontSize: "10px", color: "#444", marginLeft: "4px" }}>std</span>}
            </span>
          </div>
        </div>

        {/* Overzichtskaart: compacte samenvatting van kernwaarden per fase */}
        {showOverzichtskaart && calcWeight && (
          <Card>
            <SectionTitle color={settings.accentKleur}>
              📋 {t("Overzicht", "Summary")} — {AGE_ITEMS[calcLeeftijdIdx]?.label} · {WEIGHT_ITEMS[calcGewichtIdx]?.label}
            </SectionTitle>

            {/* Luchtweg */}
            {(hasAge || isPrematuur) && (
              <div style={{ marginBottom: "14px" }}>
                <div style={{ fontSize: "10px", fontWeight: 700, color: "#F39C12", textTransform: "uppercase", letterSpacing: "1px", marginBottom: "6px" }}>
                  {t("Luchtweg", "Airway")}
                </div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: "6px" }}>
                  {[
                    { label: "ETT", waarde: tubeMaat, eenheid: "" },
                    { label: "Blad", waarde: tubeBlad, eenheid: "" },
                    { label: "Kapje", waarde: masker?.maat, eenheid: "" },
                    { label: "LMA", waarde: lma?.maat, eenheid: "" },
                  ].filter(x => x.waarde != null).map((x, i) => (
                    <div key={i} style={{
                      background: "rgba(243,156,18,0.08)", borderRadius: "8px", padding: "6px 10px",
                      border: "1px solid rgba(243,156,18,0.15)",
                    }}>
                      <span style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, color: "#F39C12", fontSize: "13px" }}>{x.waarde}{x.eenheid}</span>
                      <span style={{ fontSize: "10px", color: "#888", marginLeft: "5px" }}>{x.label}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Medicatie per fase */}
            {OVERZICHT_MEDS.map((groep, gi) => (
              <div key={gi} style={{ marginBottom: gi < OVERZICHT_MEDS.length - 1 ? "14px" : 0 }}>
                <div style={{
                  fontSize: "10px", fontWeight: 700, textTransform: "uppercase", letterSpacing: "1px", marginBottom: "6px",
                  color: groep.fase === "Nood" ? "#E74C3C" : settings.accentKleur,
                }}>
                  {t(groep.fase, groep.fase)}
                </div>
                {groep.items.map((it, ii) => (
                  <div key={ii} style={{
                    display: "flex", justifyContent: "space-between", alignItems: "center",
                    padding: "6px 0", borderBottom: ii < groep.items.length - 1 ? "1px solid rgba(255,255,255,0.06)" : "none",
                  }}>
                    <span style={{ fontSize: "13px", color: "#ddd", fontWeight: 600 }}>
                      {it.naam}
                      {it.propPct && <span style={{ fontSize: "10px", color: "#F5C518", marginLeft: "5px" }}>({it.propPct})</span>}
                    </span>
                    <span style={{ textAlign: "right" }}>
                      <span style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, fontSize: "14px", color: groep.fase === "Nood" ? "#E74C3C" : settings.accentKleur }}>
                        {it.dosisStr}
                      </span>
                      <span style={{ fontSize: "10px", color: "#888", marginLeft: "3px" }}>{it.unit}</span>
                      {it.propMlStr && (
                        <span style={{ fontSize: "11px", color: "#F5C518", fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, marginLeft: "6px" }}>
                          · {it.propMlStr} ml{it.propLabel && it.propLabel.includes("onderhoud") ? "/uur" : ""}
                        </span>
                      )}
                    </span>
                  </div>
                ))}
              </div>
            ))}
          </Card>
        )}

        {/* ETT / Tube info */}
        {(hasAge || isPrematuur) && (
          <Collapse title={isPrematuur ? "Tube, sonde, blad & katheter (prematuur)" : "Tube, sonde, blad & katheter (op leeftijd)"} color="#F39C12">
            {isPrematuur && (
              <div style={{ fontSize: "12px", color: "#F39C12", marginBottom: "10px", fontWeight: 700 }}>
                Prematuur / neonaat {WEIGHT_ITEMS[calcGewichtIdx]?.label} — uncuffed, maten op gewicht
              </div>
            )}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "8px" }}>
              {[
                { label: "ETT maat", waarde: tubeMaat, eenheid: "" },
                { label: "ETT diepte", waarde: tubeDiepte, eenheid: "cm" },
                { label: "Laryngoscoopblad", waarde: tubeBlad, eenheid: "" },
                { label: "Maagsonde", waarde: tubeSonde, eenheid: "Fr" },
                { label: "Blaaskatheter", waarde: tubeKath, eenheid: "Ch" },
              ].filter(item => item.waarde != null).map((item, i) => (
                <div key={i} style={{
                  background: "rgba(243,156,18,0.08)",
                  borderRadius: "10px",
                  padding: "12px 8px",
                  textAlign: "center",
                  border: "1px solid rgba(243,156,18,0.15)",
                }}>
                  <div style={{
                    fontSize: isNaN(parseFloat(item.waarde)) ? "15px" : "22px",
                    fontWeight: 900,
                    fontFamily: "'JetBrains Mono', monospace",
                    color: "#F39C12",
                  }}>{item.waarde}{item.eenheid && <span style={{ fontSize: "12px", color: "#888" }}> {item.eenheid}</span>}</div>
                  <div style={{ fontSize: "10px", textTransform: "uppercase", letterSpacing: "1px", color: "#888", marginTop: "4px" }}>{item.label}</div>
                </div>
              ))}
            </div>
          </Collapse>
        )}

        {/* Beademingskapje & LMA maten */}
        {hasAge && (
          <Collapse title="Beademingskapje & LMA" color="#9B59B6">
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px" }}>
              {[
                { label: "Beademingskapje", maat: masker.maat, sub: masker.label, kleur: masker.kleur, extra: null },
                { label: "LMA", maat: lma.maat, sub: lma.label, kleur: lma.kleur, extra: `Manchet max ${lma.maxVol}` },
              ].map((item, i) => (
                  <div key={i} style={{
                    background: `${item.kleur}12`,
                    borderRadius: "10px",
                    padding: "14px 12px",
                    textAlign: "center",
                    border: `1px solid ${item.kleur}25`,
                  }}>
                    <div style={{
                      fontSize: "10px",
                      textTransform: "uppercase",
                      letterSpacing: "1px",
                      color: "#888",
                      marginBottom: "6px",
                    }}>{item.label}</div>
                    <div style={{
                      fontSize: "26px",
                      fontWeight: 900,
                      fontFamily: "'JetBrains Mono', monospace",
                      color: item.kleur,
                    }}>maat {item.maat}</div>
                    <div style={{ fontSize: "11px", color: "#666", marginTop: "4px" }}>{item.sub}</div>
                    {item.extra && <div style={{ fontSize: "10px", color: item.kleur, marginTop: "4px", fontWeight: 600 }}>{item.extra}</div>}
                  </div>
              ))}
            </div>
            {/* Reference tabel masker */}
            <div style={{ marginTop: "14px" }}>
              <div style={{ fontSize: "10px", textTransform: "uppercase", letterSpacing: "1px", color: "#555", marginBottom: "6px" }}>Beademingskapje — alle maten</div>
              {MASKER_MATEN.map((m, i) => {
                const isActive = age >= m.leeftijdMin && age < m.leeftijdMax;
                const isLast = i === MASKER_MATEN.length - 1 && age >= m.leeftijdMin;
                const highlight = isActive || isLast;
                return (
                  <div key={i} style={{
                    display: "flex",
                    justifyContent: "space-between",
                    padding: "5px 8px",
                    borderRadius: "6px",
                    background: highlight ? `${m.kleur}15` : "transparent",
                    border: highlight ? `1px solid ${m.kleur}30` : "1px solid transparent",
                    marginBottom: "2px",
                    fontSize: "12px",
                  }}>
                    <span style={{ color: highlight ? "#fff" : "#666" }}>{m.label}</span>
                    <span style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: highlight ? 700 : 400, color: highlight ? m.kleur : "#555" }}>maat {m.maat}</span>
                  </div>
                );
              })}
            </div>
            {/* Reference tabel LMA */}
            <div style={{ marginTop: "12px" }}>
              <div style={{ fontSize: "10px", textTransform: "uppercase", letterSpacing: "1px", color: "#555", marginBottom: "6px" }}>LMA — alle maten</div>
              {LMA_MATEN.map((m, i) => {
                const isActive = age >= m.leeftijdMin && age < m.leeftijdMax;
                const isLast = i === LMA_MATEN.length - 1 && age >= m.leeftijdMin;
                const highlight = isActive || isLast;
                return (
                  <div key={i} style={{
                    display: "flex",
                    justifyContent: "space-between",
                    alignItems: "center",
                    padding: "5px 8px",
                    borderRadius: "6px",
                    background: highlight ? `${m.kleur}15` : "transparent",
                    border: highlight ? `1px solid ${m.kleur}30` : "1px solid transparent",
                    marginBottom: "2px",
                    fontSize: "12px",
                  }}>
                    <span style={{ color: highlight ? "#fff" : "#666" }}>{m.label}</span>
                    <span style={{ display: "flex", gap: "8px", alignItems: "center" }}>
                      <span style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: highlight ? 700 : 400, color: highlight ? m.kleur : "#555" }}>maat {m.maat}</span>
                      <span style={{ fontSize: "10px", color: "#555" }}>{m.maxVol}</span>
                    </span>
                  </div>
                );
              })}
              <div style={{ fontSize: "10px", color: "#555", marginTop: "6px" }}>* Bij volwassenen: maat 4 (50–70 kg), maat 5 (70–100 kg), maat 6 (&gt;100 kg)</div>
            </div>
          </Collapse>
        )}

        {/* Vochtbeleid */}
        {calcWeight && (() => {
          // 4-2-1 regel (Holliday-Segar) onderhoudsvocht in ml/uur
          const w = calcWeight;
          let mlPerUur;
          let breakdown;
          if (w <= 10) {
            mlPerUur = 4 * w;
            breakdown = `4 × ${w} kg`;
          } else if (w <= 20) {
            mlPerUur = 40 + 2 * (w - 10);
            breakdown = `40 + 2 × ${(w - 10).toFixed(w % 1 ? 1 : 0)} kg`;
          } else {
            mlPerUur = 60 + 1 * (w - 20);
            breakdown = `60 + 1 × ${(w - 20).toFixed(w % 1 ? 1 : 0)} kg`;
          }
          const mlPerUurStr = mlPerUur < 10 ? mlPerUur.toFixed(1) : mlPerUur.toFixed(0);
          return (
            <Collapse title="Vochtbeleid" color="#3498DB">
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px", marginBottom: "10px" }}>
                {[
                  { label: "Onderhoud 1e ½ uur", waarde: `${(w * 10).toFixed(0)} ml`, sub: "10 ml/kg" },
                  { label: "Vochtbolus", waarde: `${(w * 10).toFixed(0)}–${(w * 20).toFixed(0)} ml`, sub: "10–20 ml/kg" },
                ].map((item, i) => (
                  <div key={i} style={{
                    background: "rgba(52,152,219,0.08)",
                    borderRadius: "10px",
                    padding: "12px",
                    border: "1px solid rgba(52,152,219,0.15)",
                  }}>
                    <div style={{
                      fontSize: "18px",
                      fontWeight: 700,
                      fontFamily: "'JetBrains Mono', monospace",
                      color: "#3498DB",
                    }}>{item.waarde}</div>
                    <div style={{ fontSize: "10px", textTransform: "uppercase", letterSpacing: "1px", color: "#888", marginTop: "4px" }}>{item.label}</div>
                    <div style={{ fontSize: "10px", color: "#555", marginTop: "2px" }}>{item.sub}</div>
                  </div>
                ))}
              </div>

              {/* 4-2-1 regel onderhoudsvocht */}
              <div style={{
                background: "rgba(52,152,219,0.10)",
                borderRadius: "10px",
                padding: "12px",
                border: "1px solid rgba(52,152,219,0.20)",
              }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: "6px" }}>
                  <div style={{ fontSize: "11px", textTransform: "uppercase", letterSpacing: "1px", color: "#3498DB", fontWeight: 700 }}>
                    4-2-1 onderhoud
                  </div>
                  <div>
                    <span style={{ fontSize: "22px", fontWeight: 700, fontFamily: "'JetBrains Mono', monospace", color: "#3498DB" }}>{mlPerUurStr}</span>
                    <span style={{ fontSize: "12px", color: "#888", marginLeft: "4px" }}>ml/uur</span>
                  </div>
                </div>
                <div style={{ fontSize: "11px", color: "#888", fontFamily: "'JetBrains Mono', monospace" }}>
                  = {breakdown}
                </div>
                <div style={{ fontSize: "10px", color: "#666", marginTop: "8px", lineHeight: 1.5 }}>
                  4 ml/kg/u (0–10 kg) · +2 ml/kg/u (10–20 kg) · +1 ml/kg/u (&gt;20 kg)
                </div>
              </div>
            </Collapse>
          );
        })()}

        {/* Medicatiedoseringen */}
        {calcWeight ? (
          Object.entries(categorieGroepen).map(([cat, meds]) => (
            <Card key={cat}>
              <SectionTitle color={cat === "Noodmedicatie" ? "#E74C3C" : "#2ECC71"}>{cat}</SectionTitle>
              {meds.map((m, i) => {
                const { dosisStr, medKleur, propPct, propLabel, propMlStr, pompMlUurStr } = computeMedDosis(m, calcWeight, age, hasAge);
                return (
                  <div key={i} style={{
                    display: "flex",
                    justifyContent: "space-between",
                    alignItems: "center",
                    padding: "10px 0 10px 8px",
                    borderBottom: i < meds.length - 1 ? "1px solid rgba(255,255,255,0.06)" : "none",
                    borderLeft: medKleur ? `4px solid ${medKleur.bg}` : "4px solid transparent",
                    gap: "8px",
                  }}>
                    <div>
                      <div style={{ fontWeight: 600, color: "#fff", fontSize: "14px" }}>
                        {m.med}
                        {m.bron && (
                          <span
                            onClick={() => setOpenBronMed(openBronMed === m.med ? null : m.med)}
                            style={{
                              display: "inline-flex", alignItems: "center", justifyContent: "center",
                              width: "16px", height: "16px", marginLeft: "6px",
                              borderRadius: "50%", border: "1px solid #666", color: "#888",
                              fontSize: "10px", fontStyle: "italic", fontWeight: 700,
                              cursor: "pointer", verticalAlign: "middle",
                            }}
                          >i</span>
                        )}
                        {propPct && (
                          <span style={{
                            marginLeft: "6px",
                            fontSize: "10px",
                            fontWeight: 700,
                            padding: "2px 6px",
                            borderRadius: "6px",
                            background: age < 3 ? "rgba(245,197,24,0.18)" : "rgba(245,197,24,0.32)",
                            color: "#F5C518",
                            letterSpacing: "0.5px",
                          }}>{propPct}</span>
                        )}
                      </div>
                      <div style={{ fontSize: "11px", color: "#666", marginTop: "2px" }}>
                        {m.range}
                        {propPct && (
                          <span style={{ color: "#888", marginLeft: "4px" }}>· {propLabel}</span>
                        )}
                      </div>
                      {m.bron && openBronMed === m.med && (
                        <div style={{
                          fontSize: "11px", color: "#aaa", marginTop: "6px", padding: "6px 8px",
                          background: "rgba(255,255,255,0.04)", borderRadius: "6px", maxWidth: "260px",
                        }}>
                          <span style={{ marginRight: "4px" }}>{m.bron.status}</span>
                          {m.bron.tekst}
                        </div>
                      )}
                    </div>
                    <div style={{
                      background: cat === "Noodmedicatie" ? "rgba(231,76,60,0.12)" : "rgba(46,204,113,0.1)",
                      borderRadius: "8px",
                      padding: "6px 10px",
                      textAlign: "right",
                      flexShrink: 0,
                      border: `1px solid ${cat === "Noodmedicatie" ? "rgba(231,76,60,0.2)" : "rgba(46,204,113,0.2)"}`,
                    }}>
                      <span style={{
                        fontFamily: "'JetBrains Mono', monospace",
                        fontWeight: 700,
                        fontSize: "16px",
                        color: cat === "Noodmedicatie" ? "#E74C3C" : "#2ECC71",
                      }}>{dosisStr}</span>
                      <span style={{ fontSize: "11px", color: "#888", marginLeft: "3px" }}>{m.unit}</span>
                      {propMlStr && (
                        <div style={{ fontSize: "11px", color: "#F5C518", fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, marginTop: "2px" }}>
                          {propMlStr} <span style={{ fontSize: "10px", color: "#888", fontWeight: 400 }}>ml{m.perUur ? "/uur" : ""}</span>
                        </div>
                      )}
                      {pompMlUurStr && (
                        <div style={{ fontSize: "11px", color: "#F5C518", fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, marginTop: "2px" }}>
                          {pompMlUurStr} <span style={{ fontSize: "10px", color: "#888", fontWeight: 400 }}>ml/uur (bij {m.pompConc} {m.unit.split("/")[0]}/ml)</span>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </Card>
          ))
        ) : (
          <div style={{ textAlign: "center", padding: "16px", color: "#586069", fontSize: "13px" }}>
            {t("Selecteer leeftijd om doseringen te berekenen", "Select age to calculate doses")}
          </div>
        )}
      </div>
    );
  };


  const TABS = [
    { id: "calculator", label: t("Calculator", "Calculator"), icon: Icons.calc, color: "#2ECC71" },
    { id: "medicatie", label: t("Medicatie", "Medication"), icon: Icons.pill, color: "#E67E22" },
  ];

  return (
    <div style={{ maxWidth: "480px", margin: "0 auto", padding: "16px 16px 40px", color: "#fff", fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" }}>
      <div style={{ marginBottom: "16px" }}>
        <div style={{ fontSize: "20px", fontWeight: 900, letterSpacing: "-0.5px" }}>Zakkaart Calculator</div>
        <div style={{ fontSize: "11px", color: "#586069", marginTop: "2px" }}>
          {t("Kinderdosering & medicatie-overzicht", "Pediatric dosing & medication overview")} · {VERSIE}
        </div>
      </div>

      <div style={{ display: "flex", gap: "8px", marginBottom: "18px" }}>
        {TABS.map(tab => (
          <button
            key={tab.id}
            onClick={() => setActiveTab(tab.id)}
            style={{
              flex: 1,
              display: "flex", alignItems: "center", justifyContent: "center", gap: "8px",
              padding: "12px 10px",
              borderRadius: "12px",
              border: activeTab === tab.id ? `1px solid ${tab.color}60` : "1px solid rgba(255,255,255,0.08)",
              background: activeTab === tab.id ? `${tab.color}18` : "rgba(255,255,255,0.03)",
              color: activeTab === tab.id ? tab.color : "#aaa",
              fontFamily: "inherit", fontWeight: 700, fontSize: "14px", cursor: "pointer",
              transition: "background 0.15s, border-color 0.15s, color 0.15s",
            }}
          >
            {React.cloneElement(tab.icon, { width: 18, height: 18 })}
            {tab.label}
          </button>
        ))}
      </div>

      {activeTab === "calculator" ? renderCalculator() : renderMedicatie()}

      <div style={{ textAlign: "center", marginTop: "24px" }}>
        <a href="./info.html" style={{ fontSize: "12px", color: "#555", textDecoration: "none" }}>
          ← {t("Naar de Zakkaart-informatie-app", "To the Zakkaart info app")}
        </a>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<CalculatorApp />);
  </script>
</body>
</html>
